name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Indice de Obsolescencia (--exemplo)
        run: python src/obsolescencia.py --exemplo

      - name: Indice de Pendentes de Cadastro (--exemplo)
        run: python src/pendentes_cadastro.py --exemplo

      - name: Validar tratamento de erro (arquivo ausente deve falhar, nao travar)
        run: |
          if python src/obsolescencia.py --inventario nao-existe.csv --regras nao-existe.json; then
            echo "Deveria ter falhado com arquivo ausente"
            exit 1
          fi
